name: tests

# The two analysis test scripts (make test). They print PASS/FAIL and exit non-zero on a failure; they need numpy and scipy.
# Every pull request and push to main; no workflow ran these tests before.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: make test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: make test
