name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tools/ops-moves.txt names its base commit
      - uses: actions/setup-python@v5  # the runner's own python3 refuses pip install (PEP 668)
        with:
          python-version: '3.x'
      - name: dependencies
        run: python3 -m pip install -r requirements.txt
      - name: tests and the public-tree check
        run: make test
